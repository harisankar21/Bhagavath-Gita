<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gītā · a verse a day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #14152b;
    --night-deep: #0d0e1e;
    --gold: #cf9f4f;
    --gold-soft: #e3c17f;
    --copper: #b8664f;
    --parchment: #f2e8d4;
    --parchment-dim: #cabfa8;
    --line: rgba(207,159,79,0.28);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse 120% 90% at 50% -10%, #22244a 0%, var(--night) 45%, var(--night-deep) 100%);
    color: var(--parchment);
    font-family: 'Spectral', serif;
    overflow-x:hidden;
  }

  .stage{
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 40px 20px 56px;
    position:relative;
  }

  /* faint radiating mandala behind everything */
  .mandala{
    position:absolute; top:50%; left:50%;
    width:900px; height:900px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    opacity:0.5;
    z-index:0;
  }
  .mandala svg{ width:100%; height:100%; }
  .mandala circle{ fill:none; stroke: rgba(207,159,79,0.09); }
  .mandala .spoke{ stroke: rgba(207,159,79,0.06); stroke-width:1; }

  header{
    text-align:center;
    margin-bottom: 34px;
    position:relative; z-index:1;
  }
  .eyebrow{
    font-family:'Spectral', serif;
    letter-spacing:0.32em;
    font-size:11px;
    text-transform:uppercase;
    color: var(--gold-soft);
    opacity:0.85;
    margin:0 0 10px;
  }
  h1{
    font-family:'Noto Serif Devanagari', serif;
    font-weight:700;
    font-size: clamp(30px, 5vw, 44px);
    margin:0 0 6px;
    color: var(--parchment);
    letter-spacing:0.01em;
  }
  .sub{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:16px;
    color: var(--parchment-dim);
    margin:0;
  }

  .card{
    position:relative; z-index:1;
    width:min(640px, 92vw);
    background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 44px clamp(24px,6vw,56px) 40px;
    backdrop-filter: blur(6px);
    box-shadow: 0 30px 70px -30px rgba(0,0,0,0.6), 0 0 0 1px rgba(207,159,79,0.04) inset;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .card.fade{ opacity:0; transform: translateY(6px); }

  .locus{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:'Spectral', serif;
    font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    color: var(--gold);
    margin-bottom: 22px;
  }
  .locus .tick{ width:16px; height:1px; background: var(--line); }

  .devanagari{
    font-family:'Noto Serif Devanagari', serif;
    font-weight:500;
    font-size: clamp(22px, 3.4vw, 28px);
    line-height:1.85;
    text-align:center;
    color: var(--gold-soft);
    margin: 0 0 18px;
  }

  .translit{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size: clamp(15px, 2vw, 17px);
    line-height:1.7;
    text-align:center;
    color: var(--parchment-dim);
    margin: 0 0 28px;
  }

  .rule{
    width:64px; height:1px;
    background: var(--line);
    margin: 0 auto 28px;
    position:relative;
  }
  .rule::after{
    content:'✦';
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    background: var(--night);
    color: var(--gold);
    font-size:11px;
    padding:0 8px;
  }

  .translation{
    font-family:'Spectral', serif;
    font-size: clamp(17px, 2.3vw, 20px);
    line-height:1.75;
    text-align:center;
    color: var(--parchment);
    margin: 0;
  }

  .theme{
    text-align:center;
    margin-top:22px;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color: var(--copper);
    opacity:0.9;
  }

  .controls{
    position:relative; z-index:1;
    margin-top: 38px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }

  .refresh-btn{
    background:none; border:none; cursor:pointer;
    width:64px; height:64px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    border: 1px solid var(--line);
    transition: border-color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
  }
  .refresh-btn:hover{
    border-color: var(--gold);
    box-shadow: 0 0 24px -6px rgba(207,159,79,0.5);
  }
  .refresh-btn:active{ transform: scale(0.94); }
  .refresh-btn:focus-visible{
    outline: 2px solid var(--gold-soft);
    outline-offset: 3px;
  }
  .refresh-btn svg{
    width:30px; height:30px;
    stroke: var(--gold-soft);
    transition: transform 0.6s cubic-bezier(0.65,0,0.35,1);
  }
  .refresh-btn.spin svg{ transform: rotate(180deg); }

  .hint{
    font-family:'Spectral', serif;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--parchment-dim);
    opacity:0.6;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .refresh-btn svg{ transition:none; }
  }

  footer{
    position:relative; z-index:1;
    margin-top:30px;
    font-size:11px;
    color: var(--parchment-dim);
    opacity:0.5;
    text-align:center;
    font-family:'Spectral', serif;
    letter-spacing:0.04em;
  }
</style>
</head>
<body>

<div class="stage">

  <div class="mandala" aria-hidden="true">
    <svg viewBox="0 0 900 900">
      <circle cx="450" cy="450" r="150"/>
      <circle cx="450" cy="450" r="260"/>
      <circle cx="450" cy="450" r="370"/>
      <circle cx="450" cy="450" r="430"/>
      <g id="spokes"></g>
    </svg>
  </div>

  <header>
    <p class="eyebrow">Bhagavad Gītā</p>
    <h1>भगवद्गीता</h1>
    <p class="sub">one verse, drawn at random, to sit with today</p>
  </header>

  <div class="card" id="card">
    <div class="locus">
      <span class="tick"></span>
      <span id="locus-text">Chapter 2 · Verse 47</span>
      <span class="tick"></span>
    </div>
    <p class="devanagari" id="devanagari"></p>
    <p class="translit" id="translit"></p>
    <div class="rule"></div>
    <p class="translation" id="translation"></p>
    <p class="theme" id="theme"></p>
  </div>

  <div class="controls">
    <button class="refresh-btn" id="refreshBtn" aria-label="Show another verse">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
        <path d="M21 3v6h-6"/>
      </svg>
    </button>
    <p class="hint">draw another verse</p>
  </div>

  <footer>Sanskrit text is the ancient original · English renderings composed for this app</footer>

</div>

<script>
  // Draw radial spokes for the mandala background
  (function drawSpokes(){
    const g = document.getElementById('spokes');
    const cx = 450, cy = 450, rInner = 150, rOuter = 430;
    for(let i=0;i<24;i++){
      const angle = (i/24) * Math.PI * 2;
      const x1 = cx + rInner*Math.cos(angle);
      const y1 = cy + rInner*Math.sin(angle);
      const x2 = cx + rOuter*Math.cos(angle);
      const y2 = cy + rOuter*Math.sin(angle);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('class','spoke');
      g.appendChild(line);
    }
  })();

  const verses = [
    {
      ch: 2, v: 47,
      theme: "on action without attachment",
      dev: "कर्मण्येवाधिकारस्ते मा फलेषु कदाचन। मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि॥",
      translit: "karmaṇy-evādhikāras te mā phaleṣu kadācana, mā karma-phala-hetur bhūr mā te saṅgo 'stv akarmaṇi",
      en: "You have a right to the work itself, never to what it yields. Don't work for the reward, and don't refuse to work either."
    },
    {
      ch: 2, v: 20,
      theme: "on the self that does not die",
      dev: "न जायते म्रियते वा कदाचिन्नायं भूत्वा भविता वा न भूयः। अजो नित्यः शाश्वतोऽयं पुराणो न हन्यते हन्यमाने शरीरे॥",
      translit: "na jāyate mriyate vā kadācin nāyaṁ bhūtvā bhavitā vā na bhūyaḥ, ajo nityaḥ śāśvato'yaṁ purāṇo na hanyate hanyamāne śarīre",
      en: "This self is never born and never dies. It doesn't begin to exist and it doesn't stop. Unborn, constant, ancient beyond memory — it isn't destroyed when the body is."
    },
    {
      ch: 18, v: 66,
      theme: "on surrender",
      dev: "सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज। अहं त्वां सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः॥",
      translit: "sarva-dharmān parityajya mām ekaṁ śaraṇaṁ vraja, ahaṁ tvāṁ sarva-pāpebhyo mokṣayiṣyāmi mā śucaḥ",
      en: "Let go of every other duty and turn to me alone for shelter. I will free you from all that binds you — don't be afraid."
    },
    {
      ch: 4, v: 7,
      theme: "on why the divine returns",
      dev: "यदा यदा हि धर्मस्य ग्लानिर्भवति भारत। अभ्युत्थानमधर्मस्य तदात्मानं सृजाम्यहम्॥",
      translit: "yadā yadā hi dharmasya glānir bhavati bhārata, abhyutthānam adharmasya tadātmānaṁ sṛjāmy aham",
      en: "Whenever what is right starts to fade, and what is wrong rises up, I take form again."
    },
    {
      ch: 4, v: 8,
      theme: "on why the divine returns",
      dev: "परित्राणाय साधूनां विनाशाय च दुष्कृताम्। धर्मसंस्थापनार्थाय सम्भवामि युगे युगे॥",
      translit: "paritrāṇāya sādhūnāṁ vināśāya ca duṣkṛtām, dharma-saṁsthāpanārthāya sambhavāmi yuge yuge",
      en: "To protect those who live rightly, to end those who cause harm, and to restore what is right — I appear, age after age."
    },
    {
      ch: 2, v: 14,
      theme: "on enduring what passes",
      dev: "मात्रास्पर्शास्तु कौन्तेय शीतोष्णसुखदुःखदाः। आगमापायिनोऽनित्यास्तांस्तितिक्षस्व भारत॥",
      translit: "mātrā-sparśās tu kaunteya śītoṣṇa-sukha-duḥkha-dāḥ, āgamāpāyino 'nityās tāṁs titikṣasva bhārata",
      en: "Heat and cold, pleasure and pain — these come from the senses touching the world, and they come and go, none of them lasting. Learn to bear them, Arjuna."
    },
    {
      ch: 3, v: 35,
      theme: "on your own path",
      dev: "श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्। स्वधर्मे निधनं श्रेयः परधर्मो भयावहः॥",
      translit: "śreyān sva-dharmo viguṇaḥ para-dharmāt sv-anuṣṭhitāt, sva-dharme nidhanaṁ śreyaḥ para-dharmo bhayāvahaḥ",
      en: "Better your own path walked imperfectly than another's walked well. Better to fail at what's truly yours than to succeed at what was never meant for you."
    },
    {
      ch: 6, v: 5,
      theme: "on being your own ally",
      dev: "उद्धरेदात्मनात्मानं नात्मानमवसादयेत्। आत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः॥",
      translit: "uddhared ātmanātmānaṁ nātmānam avasādayet, ātmaiva hy ātmano bandhur ātmaiva ripur ātmanaḥ",
      en: "Lift yourself up by your own effort; don't let yourself sink. You are your own best friend, and you can just as easily be your own worst enemy."
    },
    {
      ch: 6, v: 19,
      theme: "on a steady mind",
      dev: "यथा दीपो निवातस्थो नेङ्गते सोपमा स्मृता। योगिनो यतचित्तस्य युञ्जतो योगमात्मनः॥",
      translit: "yathā dīpo nivāta-stho neṅgate sopamā smṛtā, yogino yata-cittasya yuñjato yogam ātmanaḥ",
      en: "A lamp sheltered from the wind doesn't flicker — that's the image for a disciplined mind, steady in meditation."
    },
    {
      ch: 7, v: 7,
      theme: "on what holds everything together",
      dev: "मत्तः परतरं नान्यत्किञ्चिदस्ति धनञ्जय। मयि सर्वमिदं प्रोतं सूत्रे मणिगणा इव॥",
      translit: "mattaḥ parataraṁ nānyat kiñcid asti dhanañjaya, mayi sarvam idaṁ protaṁ sūtre maṇi-gaṇā iva",
      en: "There is nothing beyond me. Everything that exists is strung on me the way pearls are strung on a single thread."
    },
    {
      ch: 9, v: 22,
      theme: "on being cared for",
      dev: "अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते। तेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम्॥",
      translit: "ananyāś cintayanto māṁ ye janāḥ paryupāsate, teṣāṁ nityābhiyuktānāṁ yoga-kṣemaṁ vahāmy aham",
      en: "For those who keep me in mind and stay devoted to nothing else, I carry what they need and guard what they already have."
    },
    {
      ch: 9, v: 26,
      theme: "on simple offerings",
      dev: "पत्रं पुष्पं फलं तोयं यो मे भक्त्या प्रयच्छति। तदहं भक्त्युपहृतमश्नामि प्रयतात्मनः॥",
      translit: "patraṁ puṣpaṁ phalaṁ toyaṁ yo me bhaktyā prayacchati, tad ahaṁ bhakty-upahṛtam aśnāmi prayatātmanaḥ",
      en: "A leaf, a flower, a fruit, water — whatever is offered with love, from a sincere heart, I accept it gladly."
    },
    {
      ch: 15, v: 7,
      theme: "on what you carry within",
      dev: "ममैवांशो जीवलोके जीवभूतः सनातनः। मनःषष्ठानीन्द्रियाणि प्रकृतिस्थानि कर्षति॥",
      translit: "mamaivāṁśo jīva-loke jīva-bhūtaḥ sanātanaḥ, manaḥ-ṣaṣṭhānīndriyāṇi prakṛti-sthāni karṣati",
      en: "Every living being carries an eternal fragment of me, drawing to itself a mind and five senses rooted in nature."
    },
    {
      ch: 18, v: 78,
      theme: "on where things go right",
      dev: "यत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः। तत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम॥",
      translit: "yatra yogeśvaraḥ kṛṣṇo yatra pārtho dhanur-dharaḥ, tatra śrīr vijayo bhūtir dhruvā nītir matir mama",
      en: "Wherever there is Krishna, master of all skill, and Arjuna, bow in hand — there you will find fortune, victory, and lasting good. That is my conviction."
    },
    {
      ch: 4, v: 18,
      theme: "on seeing clearly",
      dev: "कर्मण्यकर्म यः पश्येदकर्मणि च कर्म यः। स बुद्धिमान्मनुष्येषु स युक्तः कृत्स्नकर्मकृत्॥",
      translit: "karmaṇy akarma yaḥ paśyed akarmaṇi ca karma yaḥ, sa buddhimān manuṣyeṣu sa yuktaḥ kṛtsna-karma-kṛt",
      en: "The wise one is the one who can see stillness within action, and the quiet action within stillness. That person has understood, whatever they're doing."
    }
  ];

  const devEl = document.getElementById('devanagari');
  const translitEl = document.getElementById('translit');
  const enEl = document.getElementById('translation');
  const locusEl = document.getElementById('locus-text');
  const themeEl = document.getElementById('theme');
  const card = document.getElementById('card');
  const btn = document.getElementById('refreshBtn');

  let lastIndex = -1;

  function pickIndex(){
    if(verses.length === 1) return 0;
    let i;
    do { i = Math.floor(Math.random() * verses.length); } while(i === lastIndex);
    return i;
  }

  function render(i){
    const verse = verses[i];
    locusEl.textContent = `Chapter ${verse.ch} · Verse ${verse.v}`;
    devEl.textContent = verse.dev;
    translitEl.textContent = verse.translit;
    enEl.textContent = verse.en;
    themeEl.textContent = verse.theme;
  }

  function showNext(){
    const i = pickIndex();
    lastIndex = i;
    card.classList.add('fade');
    btn.classList.add('spin');
    setTimeout(() => {
      render(i);
      card.classList.remove('fade');
    }, 220);
    setTimeout(() => btn.classList.remove('spin'), 600);
  }

  btn.addEventListener('click', showNext);

  // initial verse on load
  render(pickIndex());
</script>

</body>
</html>
